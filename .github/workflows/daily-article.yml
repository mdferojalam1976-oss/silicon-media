name: Daily Article Draft

on:
  # Run every day at 00:00 UTC (08:00 CST)
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic slug (optional, leave blank for random)'
        required: false
        type: string

jobs:
  generate-daily-post:
    name: Generate Daily Article Draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate daily post
        id: generate
        run: |
          cd scripts
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            echo "Using specified topic: ${{ github.event.inputs.topic }}"
            node generate-daily-post.js --topic "${{ github.event.inputs.topic }}"
          else
            echo "Generating random weekly topic..."
            node generate-daily-post.js
          fi

      - name: Detect changed files
        id: changed
        run: |
          echo "files=$(git diff --name-only HEAD)" >> $GITHUB_OUTPUT
          echo "status=$(git status --porcelain)" >> $GITHUB_OUTPUT

      - name: Create PR with new article
        if: contains(steps.changed.outputs.status, '??')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Get the name of the new file
          NEW_FILE=$(git diff --name-only --diff-filter=A HEAD | grep '.mdx$' | head -1)
          
          if [ -n "$NEW_FILE" ]; then
            echo "New article file: $NEW_FILE"
            
            # Create a descriptive branch name
            BRANCH_NAME="daily-article-$(date +%Y%m%d)"
            git switch -c "$BRANCH_NAME" 2>/dev/null || git switch "$BRANCH_NAME"
            git add "$NEW_FILE"
            git commit -m "docs: daily article draft - $(basename $NEW_FILE .mdx)"
            
            # Push branch
            git push -u origin "$BRANCH_NAME" || true

            # Create PR
            gh pr create \
              --title "Daily Article Draft: $(date +'%B %d, %Y')" \
              --body "## Silicon Codex — Daily Article Draft

Automated daily article draft generated by the GitHub Actions workflow.

**File:** \`$NEW_FILE\`

### Next Steps
- [ ] Edit the article content below the frontmatter
- [ ] Add audio narration URL if applicable
- [ ] Review and refine the bilingual content
- [ ] Merge to \`main\` when ready to publish

---
*This PR was automatically generated by the daily-article workflow.*" \
              --base main \
              2>/dev/null || echo "PR creation skipped (may need gh cli auth)"
          else
            echo "No new file detected, skipping PR creation"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit directly to main if no PR mode
        if: contains(steps.changed.outputs.status, '??')
        run: |
          # Get the name of the new file
          NEW_FILE=$(git diff --name-only --diff-filter=A HEAD | grep '.mdx$' | head -1)
          
          if [ -n "$NEW_FILE" ] && [ -z "$(git log --oneline -1 | grep 'Merge pull request')" ]; then
            # Only commit directly if we're on main and no open PR was created
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add "$NEW_FILE"
            git commit -m "docs: daily article draft - $(basename $NEW_FILE .mdx)"
            echo "Committed article draft to main"
          fi

      - name: Show generated files
        run: |
          echo "=== Changed files ==="
          git diff --name-only
          echo "=== Untracked files ==="
          git status --porcelain | grep '^??' || echo "None"

      - name: Summary
        run: |
          echo "## Daily Article Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date -u +'%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY
          echo "| Topic | ${{ github.event.inputs.topic || 'random' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Files changed | $(git diff --name-only | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated file:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff --name-only --diff-filter=A | grep '.mdx$' | head -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
